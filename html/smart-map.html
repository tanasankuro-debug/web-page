<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผนที่อัจฉริยะ — Heat Safe Khon Kaen</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: #010C1A;
      font-family: 'Noto Sans Thai', 'Barlow Condensed', sans-serif;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .mb-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem;
      height: 52px;
      background: #0B1829;
      border-bottom: 1px solid #1E3050;
      flex-shrink: 0;
      z-index: 10;
    }

    /* Back button */
    .mb-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #FB923C;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border: 1.5px solid rgba(251,146,60,0.35);
      border-radius: 8px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .mb-back:hover,
    .mb-back:focus-visible {
      background: rgba(251,146,60,0.12);
      border-color: rgba(251,146,60,0.65);
      outline: 2px solid rgba(251,146,60,0.5);
      outline-offset: 2px;
    }

    /* Title */
    .mb-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #F1F5F9;
      flex: 1;
      min-width: 0;
    }

    /* Close / home button */
    .mb-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      color: #64748B;
      font-size: 1.1rem;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .mb-close:hover,
    .mb-close:focus-visible {
      background: rgba(255,255,255,0.08);
      color: #F1F5F9;
      outline: 2px solid rgba(255,255,255,0.3);
      outline-offset: 2px;
    }

    /* ── iframe ── */
    .mb-frame {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="mb-bar">
    <a href="javascript:history.back()" class="mb-back" aria-label="กลับ">
      <svg viewBox="0 0 20 20" fill="none" width="15" height="15" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13 10H7M10 13l-3-3 3-3"/>
        <circle cx="10" cy="10" r="8"/>
      </svg>
      กลับ
    </a>
    <span class="mb-title" style="flex-direction:column;align-items:flex-start;gap:0;line-height:1.2;">
      <span style="display:flex;align-items:center;gap:5px;">
        <svg viewBox="0 0 16 16" fill="none" width="13" height="13" stroke="#FB923C"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="5" height="5" rx="1"/>
          <rect x="9" y="2" width="5" height="5" rx="1"/>
          <rect x="2" y="9" width="5" height="5" rx="1"/>
          <rect x="9" y="9" width="5" height="5" rx="1"/>
        </svg>
        <h1 style="display:inline;font:inherit;margin:0;padding:0;color:inherit;">แผนที่อัจฉริยะ</h1>
      </span>
      <span style="font-size:0.65rem;color:rgba(241,245,249,0.5);font-weight:400;padding-left:18px;">Smart Map — ข้อมูลความร้อน PM2.5 และน้ำท่วมขอนแก่น</span>
    </span>
    <a href="index.html" class="mb-close" aria-label="ปิด">✕</a>
  </div>

  <!-- Embedded map -->
  <iframe
    class="mb-frame"
    src="https://heat-safe-cyan.vercel.app/?map"
    title="แผนที่อัจฉริยะ Heat Safe Khon Kaen"
    allow="geolocation; fullscreen"
    loading="eager"
  ></iframe>

</body>
</html>
