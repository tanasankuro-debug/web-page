<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="แผนที่ความร้อนขอนแก่นเรียลไทม์ — อุณหภูมิ ดัชนีความร้อน Heat Index รายอำเภอ" />
  <title>แผนที่ความร้อน — Heat Safe Khon Kaen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/mappage.css" />

  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    /* ── Sidebar width override ──────────────────────────────────── */
    #hmf-sidebar { width: 360px; }
    @media (max-width: 860px) { #hmf-sidebar { width: 320px; } }

    /* ── Time selector ───────────────────────────────────────────── */
    .hmf-time-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 6px;
    }
    .hmf-time-btn {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px;
      color: rgba(255,255,255,.7);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      padding: 10px 4px;
      text-align: center;
      transition: background var(--dur), border-color var(--dur), color var(--dur);
    }
    .hmf-time-btn span {
      display: block;
      font-size: 11px;
      font-weight: 400;
      opacity: .75;
      margin-top: 3px;
    }
    .hmf-time-btn:hover {
      background: rgba(255,255,255,.12);
      color: #fff;
    }
    .hmf-time-btn.active {
      background: rgba(239,68,68,.25);
      border-color: rgba(239,68,68,.6);
      color: #fca5a5;
    }

    /* ── Sidebar detail panel ────────────────────────────────────── */
    .hmf-point-name {
      font-size: 13px;
      color: rgba(255,255,255,.6);
      margin-bottom: 4px;
    }
    .hmf-temp-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .hmf-temp-big {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
    }
    .hmf-temp-badge {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      padding: 3px 11px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .hmf-hi-card {
      border: 1px solid;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .hmf-hi-label {
      font-size: 11px;
      color: rgba(255,255,255,.5);
      margin-bottom: 5px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .hmf-hi-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .hmf-hi-val {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }
    .hmf-hi-risk {
      font-size: 15px;
      font-weight: 700;
    }
    .hmf-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .hmf-stat {
      background: rgba(255,255,255,.06);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .hmf-stat-label {
      font-size: 11px;
      color: rgba(255,255,255,.5);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .hmf-stat-val {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: #f5f5f4;
      line-height: 1;
    }
    .hmf-chart-box {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 12px;
    }
    .hmf-chart-title {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .hmf-hottest-badge {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.55;
    }

    /* ── Map legend ──────────────────────────────────────────────── */
    #hmf-legend {
      position: absolute;
      bottom: 2.5rem;
      left: .75rem;
      z-index: 10;
      background: rgba(11,15,26,.88);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 9px;
      padding: 10px 13px;
      font-family: sans-serif;
      font-size: 13px;
      color: #e5e7eb;
      pointer-events: none;
      min-width: 155px;
    }

    /* ── Mobile toggle ───────────────────────────────────────────── */
    #hmf-toggle {
      display: none;
      position: absolute;
      top: .875rem;
      left: .875rem;
      z-index: 20;
      align-items: center;
      gap: .375rem;
      padding: .45rem .875rem;
      background: rgba(11,15,26,.88);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-body);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
    }
    @media (max-width: 640px) {
      #hmf-toggle { display: flex; }
    }
  </style>
</head>
<body class="map-page" data-theme="heat">

  <video class="map-bg-video" autoplay muted loop playsinline
         aria-hidden="true">
    <source src="../assets/khonkean.mp4" type="video/mp4" />
  </video>

  <a class="skip-link" href="#hmf-map-el">ข้ามไปยังแผนที่</a>

  <!-- ── HEADER ─────────────────────────────────────────────────────────── -->
  <header id="site-header" role="banner">
    <div class="header-inner container">
      <a href="index.html" class="site-logo" aria-label="Heat Safe Khon Kaen — หน้าแรก">
        <span class="logo-heat">Heat Safe</span>
        <span class="logo-city">Khon Kaen</span>
      </a>
      <nav id="main-nav" aria-label="เมนูหลัก">
        <ul class="nav-links" role="list">
          <li><a href="index.html"  class="nav-link">หน้าแรก</a></li>
          <li><a href="heat.html"   class="nav-link active"><span class="nav-icon nav-icon--heat"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="17" r="7"/><path d="M24 7V4M24 27V30M37 17H34M11 17H14M31 10L33 8M17 10L15 8M31 24L33 26M17 24L15 26"/><path d="M8 37c3-4 5-4 8 0s5 4 8 0 5-4 8 0 5 4 8 0"/><path d="M8 44c3-4 5-4 8 0s5 4 8 0 5-4 8 0 5 4 8 0"/></svg></span> ความร้อน</a></li>
          <li><a href="dust.html"   class="nav-link"><span class="nav-icon nav-icon--pm25"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20h18a5.5 5.5 0 1 0-5-7.5"/><path d="M5 29h24a6 6 0 0 0 0-12h-2"/><path d="M5 37h20"/><path d="M5 44h13"/><circle cx="35" cy="37" r="2" fill="currentColor" stroke="none"/><circle cx="30" cy="44" r="2" fill="currentColor" stroke="none"/><circle cx="42" cy="43" r="2" fill="currentColor" stroke="none"/><circle cx="43" cy="33" r="2" fill="currentColor" stroke="none"/></svg></span> ฝุ่น PM2.5</a></li>
          <li><a href="rain.html"   class="nav-link"><span class="nav-icon nav-icon--storm"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 31A13 13 0 1 1 31 18.5h3a8 8 0 0 1 5 14"/><path d="M11 39l-2 7"/><path d="M22 38l-2 8"/><path d="M38 27l-5 8h6l-5 8"/></svg></span> ฝน/พายุ</a></li>
          <li><a href="flood.html"  class="nav-link"><span class="nav-icon nav-icon--flood"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24l16-12 16 12"/><path d="M14 23v9"/><path d="M34 23v9"/><path d="M20 32h8"/><path d="M5 35c3-4 5.5-4 8 0s5 4 8 0 5.5-4 8 0 5 4 8 0"/><path d="M5 43c3-4 5.5-4 8 0s5 4 8 0 5.5-4 8 0 5 4 8 0"/></svg></span> น้ำท่วม</a></li>
        </ul>
        <a href="heat.html" class="btn btn-outline btn-sm nav-cta">&#x2190; กลับ</a>
      </nav>
      <button class="hamburger" id="hamburger"
              aria-label="เปิด/ปิดเมนูนำทาง" aria-expanded="false" aria-controls="main-nav">
        <span class="ham-line"></span><span class="ham-line"></span><span class="ham-line"></span>
      </button>
    </div>
  </header>

  <!-- ── MAIN ──────────────────────────────────────────────────────────────── -->
  <main class="map-main" id="hmf-main">

    <!-- ── SIDEBAR ──────────────────────────────────────────────────────── -->
    <aside class="map-sidebar" id="hmf-sidebar" aria-label="ข้อมูลความร้อน">
      <div class="map-sidebar-inner">

        <!-- Heading -->
        <p class="sidebar-heading">🌡 แผนที่ความร้อนขอนแก่น</p>

        <!-- Time selector -->
        <div>
          <p class="sidebar-section-label">เลือกช่วงเวลา</p>
          <div class="hmf-time-group" role="group" aria-label="เลือกช่วงเวลา">
            <button class="hmf-time-btn" data-time-slot="morning" aria-pressed="false">
              เช้า<span>06:00</span>
            </button>
            <button class="hmf-time-btn" data-time-slot="noon" aria-pressed="false">
              กลางวัน<span>12:00</span>
            </button>
            <button class="hmf-time-btn" data-time-slot="evening" aria-pressed="false">
              เย็น<span>18:00</span>
            </button>
            <button class="hmf-time-btn active" data-time-slot="now" aria-pressed="true">
              ปัจจุบัน<span>Live</span>
            </button>
          </div>
        </div>

        <!-- Detail panel -->
        <div>
          <p class="sidebar-section-label">ข้อมูลพื้นที่</p>
          <div id="hmf-panel">
            <p style="color:rgba(255,255,255,.4);font-size:12px;text-align:center;padding:16px 0;">
              กำลังโหลดข้อมูล...
            </p>
          </div>
        </div>

        <!-- Layer switcher -->
        <div>
          <p class="sidebar-section-label">ชั้นแผนที่</p>
          <div class="layer-btn-group" role="group" aria-label="เลือกชั้นแผนที่">
            <button class="layer-btn active" data-heat-layer="esriSatellite" aria-pressed="true">
              <span class="rt-icon rt-icon--satellite"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>
              Esri ดาวเทียม
            </button>
            <button class="layer-btn" data-heat-layer="esriRelief" aria-pressed="false">
              <span class="rt-icon rt-icon--terrain"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l4-8 4 4 4-7 4 11H3z"/></svg></span>
              ภูมิประเทศ
            </button>
            <button class="layer-btn" data-heat-layer="osm" aria-pressed="false">
              <span class="rt-icon rt-icon--roadmap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21L10 3"/><path d="M16 21L14 3"/><path d="M3 8h18M3 16h18"/></svg></span>
              แผนที่ถนน
            </button>
          </div>
        </div>

        <!-- Source -->
        <p class="sidebar-live-meta">
          ข้อมูลจาก <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
          · อัพเดตทุก 15 นาที
        </p>

      </div>
    </aside>

    <!-- Mobile sidebar toggle -->
    <button id="hmf-toggle" aria-label="เปิด/ปิด sidebar" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      ข้อมูล
    </button>

    <!-- ── MAP ─────────────────────────────────────────────────────────── -->
    <div class="map-canvas">
      <div id="hmf-map-el"
           style="position:absolute;inset:0;width:100%;height:100%;"
           role="application"
           aria-label="แผนที่ความร้อนขอนแก่น — คลิกจุดเพื่อดูข้อมูล"></div>
    </div>

  </main>

  <!-- ── SCRIPTS ────────────────────────────────────────────────────────── -->
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/heat-map-full.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initStickyHeader === 'function') initStickyHeader();
      if (typeof initHamburger   === 'function') initHamburger();
      initHeatMapFull();

      /* Mobile sidebar toggle */
      const toggle  = document.getElementById('hmf-toggle');
      const sidebar = document.getElementById('hmf-sidebar');
      if (toggle && sidebar) {
        toggle.addEventListener('click', () => {
          const open = sidebar.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(open));
        });
      }
    });
  </script>

</body>
</html>
