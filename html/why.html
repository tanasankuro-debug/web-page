<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>รู้หรือเปล่า? — Heat Safe Khon Kaen</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d1b2a;
    }

    /* ── Video ── */
    .why-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 70%;
      z-index: 0;
    }

    /* ── Entrance animation ── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Invisible overlay links ── */
    .why-link {
      position: fixed;
      z-index: 3;
      background: transparent;
      cursor: pointer;
      border-radius: 100px;
      display: block;
      /* debug: outline: 2px solid red; */
    }

    /* Desktop (landscape) — ตำแหน่งตรงปุ่มในวิดีโอ */
    .why-link-know {
      top: 78%;
      left: 7%;
      width: 31%;
      height: 19%;
      animation: fade-up 0.5s ease 0.4s both;
    }
    .why-link-data {
      top: 78%;
      left: 40%;
      width: 32%;
      height: 19%;
      animation: fade-up 0.5s ease 0.6s both;
    }

    /* ── Navigation dots ── */
    .why-dots {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      gap: 0.55rem;
      align-items: center;
      animation: fade-up 0.5s ease 0.9s both;
    }
    .why-dot {
      display: block;
      height: 8px;
      border-radius: 100px;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .why-dot-inactive {
      width: 8px;
      background: rgba(255,255,255,0.32);
    }
    .why-dot-inactive:hover { background: rgba(255,255,255,0.65); }
    .why-dot-active {
      width: 26px;
      background: #fff;
      cursor: default;
    }

    /* ── Invisible URL bar link (desktop) ── */
    .why-url-link {
      position: fixed;
      top: 82%;
      left: 62%;
      right: 1%;
      height: 14%;
      z-index: 3;
      cursor: pointer;
      background: transparent;
      display: block;
      border-radius: 12px;
    }

    /* ── Mobile overrides ── */
    @media (max-width: 768px) {

      /* ปุ่มเรียงซ้อนกันแนวตั้ง ตามตำแหน่งในคลิปมือถือ */
      .why-link-know {
        top: 54%;
        bottom: auto;
        left: 4%;
        width: 54%;
        height: 10%;
        border-radius: 100px;
      }
      .why-link-data {
        top: 66%;
        bottom: auto;
        left: 4%;
        width: 54%;
        height: 10%;
        border-radius: 100px;
      }

      /* URL bar ล่างสุดบนมือถือ */
      .why-url-link {
        bottom: 1%;
        left: 4%;
        right: 4%;
        height: 7%;
      }

      .why-dots { bottom: 9%; }
    }
  </style>
</head>
<body>

  <video class="why-video" id="why-video"
    autoplay muted loop playsinline preload="auto">
  </video>

  <script>
    (function () {
      var video = document.getElementById('why-video');
      var mobile = window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      video.src = mobile ? '../assets/why%20mobile.mp4' : '../assets/why.mp4';
    })();
  </script>

  <!-- Invisible overlay: ปุ่ม อยากรู้เลย! -->
  <a class="why-link why-link-know"
     href="main.html"
     aria-label="อยากรู้เลย — เข้าสู่ข้อมูล"></a>

  <!-- Invisible overlay: ปุ่ม ดูข้อมูลก่อน -->
  <a class="why-link why-link-data"
     href="smart-map.html"
     aria-label="ดูข้อมูลก่อน — เข้าสู่แผนที่"></a>

  <!-- Invisible overlay: URL bar ม่วงด้านล่าง -->
  <a class="why-url-link"
     href="https://web-page-rose-six.vercel.app/"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="เปิดเว็บ Heat Safe Khon Kaen"></a>

  <!-- Page dots -->
  <nav class="why-dots" aria-label="ขั้นตอน">
    <a href="intro.html" class="why-dot why-dot-inactive" aria-label="หน้าที่ 1"></a>
    <span class="why-dot why-dot-active" aria-current="page" aria-label="หน้าที่ 2"></span>
  </nav>

</body>
</html>
