<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin · Heat Safe Khon Kaen</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:    #010D1E;
      --surf:  rgba(255,255,255,.04);
      --brd:   rgba(255,255,255,.08);
      --text:  #F1F5F9;
      --muted: #64748B;
      --green: #4ADE80;
      --amber: #FCD34D;
      --red:   #F87171;
      --blue:  #60A5FA;
    }
    html,body { min-height:100dvh; background:var(--bg); color:var(--text); }
    body { font-family:'Noto Sans Thai',sans-serif; -webkit-font-smoothing:antialiased; }

    /* ── Topbar ────────────────────────────────────── */
    .topbar {
      position:sticky; top:0; z-index:50;
      height:52px; background:rgba(1,13,30,.92);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid var(--brd);
      display:flex; align-items:center; padding:0 1.25rem; gap:.75rem;
    }
    .tb-logo { font-family:'Barlow Condensed',sans-serif; font-size:1.15rem; font-weight:800; color:var(--green); letter-spacing:-.01em; }
    .tb-sep  { width:1px; height:20px; background:var(--brd); flex-shrink:0; }
    .tb-badge {
      font-family:'Barlow Condensed',sans-serif; font-size:.58rem; font-weight:700;
      letter-spacing:.2em; text-transform:uppercase;
      background:rgba(252,211,77,.1); border:1px solid rgba(252,211,77,.28);
      color:var(--amber); border-radius:99px; padding:.18rem .75rem;
    }
    .tb-right { margin-left:auto; display:flex; align-items:center; gap:.55rem; }
    .tb-btn {
      display:none; align-items:center; gap:.35rem;
      border-radius:8px; padding:.36rem .78rem;
      font-family:'Noto Sans Thai',sans-serif; font-size:.74rem; font-weight:600;
      cursor:pointer; transition:background .15s;
    }
    .tb-refresh { background:var(--surf); border:1px solid var(--brd); color:var(--muted); }
    .tb-refresh:hover { background:rgba(255,255,255,.08); color:var(--text); }
    .tb-logout  { background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.22); color:var(--red); }
    .tb-logout:hover  { background:rgba(248,113,113,.16); }

    /* ── Login ─────────────────────────────────────── */
    #login-screen {
      min-height:calc(100dvh - 52px);
      display:flex; align-items:center; justify-content:center;
      padding:2rem 1.25rem;
    }
    .login-card {
      width:100%; max-width:340px;
      background:rgba(255,255,255,.035); border:1px solid var(--brd);
      border-radius:20px; padding:2.5rem 2rem; text-align:center;
    }
    .login-icon {
      width:58px; height:58px; border-radius:50%;
      background:rgba(252,211,77,.08); border:1.5px solid rgba(252,211,77,.25);
      margin:0 auto 1.25rem; display:grid; place-items:center; font-size:1.55rem;
    }
    .login-title { font-family:'Barlow Condensed',sans-serif; font-size:1.7rem; font-weight:800; margin-bottom:.2rem; }
    .login-sub   { font-size:.78rem; color:var(--muted); margin-bottom:1.75rem; line-height:1.6; }
    .login-input {
      width:100%; background:rgba(255,255,255,.05); border:1.5px solid var(--brd);
      border-radius:11px; color:var(--text);
      font-family:'Noto Sans Thai',sans-serif; font-size:.95rem;
      padding:.78rem 1rem; margin-bottom:.8rem; transition:border-color .15s;
    }
    .login-input:focus { outline:none; border-color:rgba(252,211,77,.5); }
    .login-btn {
      width:100%; background:var(--amber); color:#000;
      font-family:'Noto Sans Thai',sans-serif; font-size:.95rem; font-weight:800;
      border:none; border-radius:11px; padding:.82rem;
      cursor:pointer; transition:background .15s, box-shadow .2s;
      box-shadow:0 4px 18px rgba(252,211,77,.2);
    }
    .login-btn:hover { background:#f59e0b; box-shadow:0 6px 26px rgba(252,211,77,.32); }
    .login-err { font-size:.78rem; color:var(--red); margin-top:.7rem; display:none; }
    .login-err.show { display:block; }

    /* ── Dashboard ─────────────────────────────────── */
    #dashboard { padding:0 0 6rem; }
    .wrap { max-width:900px; margin:0 auto; padding:0 1.25rem; }

    /* Stats */
    .stats-row {
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:.7rem; margin:1.25rem 0 1.1rem;
    }
    .stat-card {
      background:var(--surf); border:1px solid var(--brd);
      border-radius:14px; padding:.85rem .95rem;
    }
    .stat-num {
      font-family:'Barlow Condensed',sans-serif;
      font-size:1.9rem; font-weight:800; line-height:1; margin-bottom:.18rem;
    }
    .stat-label { font-size:.65rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
    .stat-card.c-amber .stat-num { color:var(--amber); }
    .stat-card.c-green .stat-num { color:var(--green); }
    .stat-card.c-blue  .stat-num { color:var(--blue);  }

    /* Map */
    .map-wrap {
      background:var(--surf); border:1px solid var(--brd);
      border-radius:16px; overflow:hidden; margin-bottom:1.1rem;
    }
    .map-hd {
      padding:.65rem 1rem; border-bottom:1px solid var(--brd);
      font-family:'Barlow Condensed',sans-serif; font-size:.58rem; font-weight:700;
      letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
      display:flex; align-items:center; gap:.45rem;
    }
    .map-legend { display:flex; gap:.85rem; margin-left:auto; }
    .map-leg-item { display:flex; align-items:center; gap:.28rem; font-size:.62rem; color:var(--muted); }
    .map-leg-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    #admin-map { height:280px; }

    /* Filter */
    .filter-row { display:flex; gap:.5rem; margin-bottom:.9rem; flex-wrap:wrap; }
    .filter-btn {
      display:inline-flex; align-items:center; gap:.4rem;
      background:var(--surf); border:1px solid var(--brd);
      border-radius:99px; padding:.38rem .95rem;
      font-family:'Noto Sans Thai',sans-serif; font-size:.76rem; font-weight:600;
      color:var(--muted); cursor:pointer; transition:all .15s;
    }
    .filter-btn.active {
      background:rgba(74,222,128,.1); border-color:rgba(74,222,128,.3); color:var(--green);
    }
    .filter-btn[data-filter="pending"].active {
      background:rgba(252,211,77,.1); border-color:rgba(252,211,77,.3); color:var(--amber);
    }
    .filter-btn[data-filter="accepted"].active {
      background:rgba(74,222,128,.1); border-color:rgba(74,222,128,.3); color:var(--green);
    }
    .fc {
      font-size:.6rem; font-weight:800; font-variant-numeric:tabular-nums;
      background:rgba(255,255,255,.08); border-radius:99px;
      padding:.05rem .42rem; min-width:18px; text-align:center;
    }

    /* Vote cards */
    #vote-list { display:flex; flex-direction:column; gap:.6rem; }
    .vote-card {
      background:var(--surf); border:1px solid var(--brd);
      border-radius:14px; padding:.9rem 1rem 1rem;
      transition:border-color .2s, opacity .2s;
    }
    .vote-card.s-accepted { border-color:rgba(74,222,128,.18); }
    .vote-card.s-pending  { border-color:rgba(252,211,77,.12); }
    .vote-card.fading     { opacity:.4; pointer-events:none; }

    .vc-top   { display:flex; align-items:flex-start; gap:.6rem; }
    .vc-dot   { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:.42rem; }
    .vc-dot.s-pending  { background:var(--amber); box-shadow:0 0 7px rgba(252,211,77,.6); }
    .vc-dot.s-accepted { background:var(--green);  box-shadow:0 0 7px rgba(74,222,128,.6); }
    .vc-body  { flex:1; min-width:0; }

    .vc-park  { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; margin-bottom:.22rem; }
    .vc-pname { font-size:.82rem; font-weight:700; }
    .vc-pth   { font-size:.7rem; color:var(--muted); }

    .vc-district { font-size:.78rem; color:rgba(255,255,255,.5); margin-bottom:.3rem; }

    .vc-meta { display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; font-size:.68rem; color:var(--muted); }
    .vc-pin  {
      display:inline-flex; align-items:center; gap:.25rem; color:var(--blue);
      text-decoration:none; cursor:pointer;
    }
    .vc-pin:hover { color:#93c5fd; }

    .vc-actions { display:flex; gap:.5rem; margin-top:.75rem; align-items:center; }
    .btn-accept {
      flex:1; display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
      background:rgba(74,222,128,.09); border:1px solid rgba(74,222,128,.22);
      border-radius:9px; padding:.44rem .9rem;
      color:var(--green); font-family:'Noto Sans Thai',sans-serif; font-size:.76rem; font-weight:700;
      cursor:pointer; transition:background .15s;
    }
    .btn-accept:hover { background:rgba(74,222,128,.17); }
    .badge-accepted {
      flex:1; display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
      font-size:.74rem; font-weight:700; color:var(--green);
      background:rgba(74,222,128,.07); border:1px solid rgba(74,222,128,.18);
      border-radius:9px; padding:.44rem .9rem;
    }
    .btn-delete {
      display:inline-flex; align-items:center; gap:.3rem;
      background:rgba(248,113,113,.07); border:1px solid rgba(248,113,113,.2);
      border-radius:9px; padding:.44rem .8rem;
      color:var(--red); font-family:'Noto Sans Thai',sans-serif; font-size:.74rem;
      cursor:pointer; transition:background .15s;
    }
    .btn-delete:hover { background:rgba(248,113,113,.15); }

    /* State boxes */
    .state-box { text-align:center; padding:3rem 1.5rem; color:var(--muted); }
    .state-icon { font-size:2rem; margin-bottom:.75rem; }

    /* Leaflet popup dark */
    .leaflet-container { background:#071525 !important; }
    .leaflet-bar a { background:#0e1f35 !important; color:#f1f5f9 !important; border-color:rgba(255,255,255,.12) !important; }
    .leaflet-bar a:hover { background:#162e4a !important; }
    .leaflet-control-attribution { background:rgba(0,0,0,.55) !important; color:rgba(255,255,255,.3) !important; font-size:9px !important; }
    .leaflet-control-attribution a { color:rgba(255,255,255,.4) !important; }
    .leaflet-popup-content-wrapper { background:#0e1f35 !important; color:#f1f5f9 !important; border:1px solid rgba(255,255,255,.1) !important; box-shadow:0 4px 20px rgba(0,0,0,.6) !important; border-radius:10px !important; }
    .leaflet-popup-tip-container .leaflet-popup-tip { background:#0e1f35 !important; }
    .leaflet-popup-content { margin:.65rem .85rem !important; font-family:'Noto Sans Thai',sans-serif !important; }

    @media (max-width:500px) {
      .stats-row { grid-template-columns:1fr 1fr; }
      .tb-logo   { font-size:1rem; }
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <span class="tb-logo">🌿 HSKK</span>
  <div class="tb-sep" aria-hidden="true"></div>
  <span class="tb-badge">Admin</span>
  <div class="tb-right">
    <button class="tb-btn tb-refresh" id="btn-refresh">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M1 4s1-1 3-2a7 7 0 1 1-2 8.5"/>
        <polyline points="1 4 1 1 4 1"/>
      </svg>
      รีเฟรช
    </button>
    <button class="tb-btn tb-logout" id="btn-logout">ออกจากระบบ</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">ระบบจัดการข้อมูลโหวตสวนสีเขียว<br>เฉพาะผู้ดูแลระบบเท่านั้น</div>
    <form id="login-form">
      <input type="password" class="login-input" id="admin-pass"
             placeholder="รหัสผ่านผู้ดูแล" autocomplete="current-password"/>
      <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
      <div class="login-err" id="login-err">รหัสผ่านไม่ถูกต้อง</div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <div class="wrap">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="s-total">—</div>
        <div class="stat-label">ทั้งหมด</div>
      </div>
      <div class="stat-card c-amber">
        <div class="stat-num" id="s-pending">—</div>
        <div class="stat-label">รอดำเนินการ</div>
      </div>
      <div class="stat-card c-green">
        <div class="stat-num" id="s-accepted">—</div>
        <div class="stat-label">รับเรื่องแล้ว</div>
      </div>
      <div class="stat-card c-blue">
        <div class="stat-num" id="s-pinned">—</div>
        <div class="stat-label">มีพิกัด</div>
      </div>
    </div>

    <!-- Map -->
    <div class="map-wrap">
      <div class="map-hd">
        <svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>
        แผนที่พิกัดที่ผู้ใช้ระบุ
        <div class="map-legend">
          <div class="map-leg-item"><div class="map-leg-dot" style="background:#FCD34D"></div>รอดำเนินการ</div>
          <div class="map-leg-item"><div class="map-leg-dot" style="background:#4ADE80"></div>รับเรื่องแล้ว</div>
        </div>
      </div>
      <div id="admin-map"></div>
    </div>

    <!-- Filter -->
    <div class="filter-row" role="tablist" aria-label="กรองสถานะ">
      <button class="filter-btn active" data-filter="all" role="tab">ทั้งหมด <span class="fc" id="fc-all">0</span></button>
      <button class="filter-btn"        data-filter="pending"  role="tab">รอดำเนินการ <span class="fc" id="fc-pending">0</span></button>
      <button class="filter-btn"        data-filter="accepted" role="tab">รับเรื่องแล้ว <span class="fc" id="fc-accepted">0</span></button>
    </div>

    <!-- List -->
    <div id="vote-list" role="list">
      <div class="state-box"><div class="state-icon">⏳</div>กำลังโหลด...</div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script>
(function () {
  'use strict';

  /* ─── CHANGE THIS PASSWORD ────────────────────────────── */
  var ADMIN_PASS = '2569';  // <─── CHANGE THIS PASSWORD
  /* ──────────────────────────────────────────────────────── */

  var PARK_META = {
    pocket_park:   { name:'Pocket Park',   th:'สวนขนาดเล็กในชุมชน',   emoji:'🌳', color:'#4ADE80' },
    green_walkway: { name:'Green Walkway', th:'ทางเดินร่มเงาสีเขียว',  emoji:'🚶', color:'#22D3EE' },
    sponge_park:   { name:'Sponge Park',   th:'สวนฟองน้ำดูดซับน้ำฝน',  emoji:'💧', color:'#60A5FA' },
    green_roof:    { name:'Green Roof',    th:'สวนบนดาดฟ้าอาคาร',      emoji:'⚡', color:'#A3E635' },
    sponge_plaza:  { name:'Sponge Plaza',  th:'ลานกิจกรรมชุมชนซับน้ำ', emoji:'🎪', color:'#FB923C' }
  };
  var MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  var _sb = null, _votes = [], _filter = 'all', _map = null, _markers = [];

  /* ── Supabase ─────────────────────────────────────────── */
  function getSb() {
    if (_sb) return _sb;
    var cfg = window.HSKK_CONFIG && window.HSKK_CONFIG.supabase;
    if (!cfg || !window.supabase) return null;
    _sb = window.supabase.createClient(cfg.url, cfg.anonKey);
    return _sb;
  }

  /* ── Auth ─────────────────────────────────────────────── */
  function isLoggedIn()  { return sessionStorage.getItem('hskk_adm') === '1'; }
  function setLoggedIn() { sessionStorage.setItem('hskk_adm', '1'); }
  function logout()      { sessionStorage.removeItem('hskk_adm'); location.reload(); }

  function tryLogin(pass) {
    if (pass === ADMIN_PASS) { setLoggedIn(); showDashboard(); loadVotes(); }
    else { document.getElementById('login-err').classList.add('show'); }
  }

  /* ── Dashboard ────────────────────────────────────────── */
  function showDashboard() {
    document.getElementById('login-screen').style.display  = 'none';
    document.getElementById('dashboard').style.display     = 'block';
    document.getElementById('btn-refresh').style.display   = 'inline-flex';
    document.getElementById('btn-logout').style.display    = 'inline-flex';
    initMap();
  }

  /* ── Helpers ──────────────────────────────────────────── */
  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543) +
           ' · ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ── Load ─────────────────────────────────────────────── */
  function loadVotes() {
    setListHtml('<div class="state-box"><div class="state-icon">⏳</div>กำลังโหลดข้อมูล...</div>');
    var sb = getSb();
    if (!sb) { setListHtml('<div class="state-box"><div class="state-icon">⚠️</div>เชื่อมต่อฐานข้อมูลไม่ได้</div>'); return; }
    sb.from('park_votes').select('*').order('created_at', { ascending: false }).limit(500)
      .then(function (res) {
        if (res.error) { setListHtml('<div class="state-box"><div class="state-icon">⚠️</div>' + esc(res.error.message) + '</div>'); return; }
        _votes = res.data || [];
        renderStats();
        renderMarkers();
        renderList();
      });
  }

  function setListHtml(html) { document.getElementById('vote-list').innerHTML = html; }

  /* ── Stats ────────────────────────────────────────────── */
  function renderStats() {
    var total    = _votes.length;
    var pending  = _votes.filter(function(v){ return (v.status||'pending') === 'pending'; }).length;
    var accepted = _votes.filter(function(v){ return v.status === 'accepted'; }).length;
    var pinned   = _votes.filter(function(v){ return v.lat != null; }).length;
    document.getElementById('s-total').textContent    = total;
    document.getElementById('s-pending').textContent  = pending;
    document.getElementById('s-accepted').textContent = accepted;
    document.getElementById('s-pinned').textContent   = pinned;
    document.getElementById('fc-all').textContent      = total;
    document.getElementById('fc-pending').textContent  = pending;
    document.getElementById('fc-accepted').textContent = accepted;
  }

  /* ── Map ──────────────────────────────────────────────── */
  function initMap() {
    if (_map || typeof L === 'undefined') return;
    _map = L.map('admin-map').setView([16.44, 102.82], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution:'&copy; OSM &copy; CARTO', subdomains:'abcd', maxZoom:19
    }).addTo(_map);
  }

  function renderMarkers() {
    _markers.forEach(function(m){ _map.removeLayer(m); });
    _markers = [];
    _votes.forEach(function(v) {
      if (v.lat == null) return;
      var st    = v.status || 'pending';
      var color = st === 'accepted' ? '#4ADE80' : '#FCD34D';
      var pm    = PARK_META[v.park_type] || {};
      var icon  = L.divIcon({
        className: '',
        html: '<div style="width:10px;height:10px;border-radius:50%;background:' + color + ';border:2px solid #010D1E;box-shadow:0 0 8px ' + color + '"></div>',
        iconSize:[10,10], iconAnchor:[5,5]
      });
      var m = L.marker([v.lat, v.lng], { icon: icon }).addTo(_map)
        .bindPopup(
          '<strong style="color:' + (pm.color||'#fff') + '">' + (pm.emoji||'') + ' ' + esc(pm.name||v.park_type) + '</strong><br>' +
          '<span style="color:#94a3b8">' + esc(v.district||'—') + '</span><br>' +
          '<span style="color:#64748b;font-size:.78em">' + fmtDate(v.created_at) + '</span>'
        );
      _markers.push(m);
    });
  }

  /* ── List ─────────────────────────────────────────────── */
  function renderList() {
    var list = _votes.filter(function(v) {
      if (_filter === 'all') return true;
      return (v.status || 'pending') === _filter;
    });

    if (!list.length) {
      setListHtml('<div class="state-box"><div class="state-icon">📭</div>ไม่มีรายการ</div>');
      return;
    }

    document.getElementById('vote-list').innerHTML = list.map(function(v) {
      var st = v.status || 'pending';
      var pm = PARK_META[v.park_type] || { name:v.park_type, emoji:'🌱', color:'#64748b', th:'' };
      var pinHtml = v.lat != null
        ? '<span class="vc-pin" onclick="panTo(' + v.lat + ',' + v.lng + ')" title="แสดงบนแผนที่">' +
          '<svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1a5 5 0 0 0-5 5c0 3.5 5 9 5 9s5-5.5 5-9a5 5 0 0 0-5-5zm0 6.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>' +
          v.lat.toFixed(4) + ', ' + v.lng.toFixed(4) + '</span>'
        : '<span>ไม่มีพิกัด</span>';

      var actHtml = st === 'pending'
        ? '<button class="btn-accept" onclick="doAccept(\'' + v.id + '\')">' +
          '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><polyline points="2 8 6 12 14 4"/></svg>รับเรื่อง</button>'
        : '<span class="badge-accepted">' +
          '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><polyline points="2 8 6 12 14 4"/></svg>รับเรื่องแล้ว</span>';

      return '<div class="vote-card s-' + st + '" id="vc-' + v.id + '" role="listitem">' +
        '<div class="vc-top">' +
          '<div class="vc-dot s-' + st + '"></div>' +
          '<div class="vc-body">' +
            '<div class="vc-park">' +
              '<span class="vc-pname" style="color:' + pm.color + '">' + pm.emoji + ' ' + esc(pm.name) + '</span>' +
              '<span class="vc-pth">— ' + esc(pm.th) + '</span>' +
            '</div>' +
            '<div class="vc-district">' + esc(v.district||'ไม่ระบุอำเภอ') + '</div>' +
            '<div class="vc-meta">' + pinHtml + '<span>' + fmtDate(v.created_at) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="vc-actions">' + actHtml +
          '<button class="btn-delete" onclick="doDelete(\'' + v.id + '\')">' +
            '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4L4 12M4 4l8 8"/></svg>' +
            'ลบ</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ── Actions ──────────────────────────────────────────── */
  window.doAccept = function(id) {
    var sb = getSb(); if (!sb) return;
    var card = document.getElementById('vc-' + id);
    if (card) card.classList.add('fading');
    sb.from('park_votes').update({ status:'accepted' }).eq('id', id).then(function(res) {
      if (res.error) { if (card) card.classList.remove('fading'); alert('เกิดข้อผิดพลาด: ' + res.error.message); return; }
      var v = _votes.find(function(x){ return String(x.id) === String(id); });
      if (v) v.status = 'accepted';
      renderStats(); renderMarkers(); renderList();
    });
  };

  window.doDelete = function(id) {
    if (!confirm('ลบรายการนี้ออกถาวร?\nไม่สามารถกู้คืนได้')) return;
    var sb = getSb(); if (!sb) return;
    var card = document.getElementById('vc-' + id);
    if (card) card.classList.add('fading');
    sb.from('park_votes').delete().eq('id', id).then(function(res) {
      if (res.error) { if (card) card.classList.remove('fading'); alert('เกิดข้อผิดพลาด: ' + res.error.message); return; }
      _votes = _votes.filter(function(x){ return String(x.id) !== String(id); });
      renderStats(); renderMarkers(); renderList();
    });
  };

  window.panTo = function(lat, lng) {
    if (_map) { _map.setView([lat, lng], 16); }
    document.querySelector('.map-wrap').scrollIntoView({ behavior:'smooth', block:'center' });
  };

  /* ── Filter ───────────────────────────────────────────── */
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      _filter = btn.dataset.filter;
      renderList();
    });
  });

  /* ── Login form ───────────────────────────────────────── */
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('login-err').classList.remove('show');
    tryLogin(document.getElementById('admin-pass').value);
  });
  document.getElementById('admin-pass').addEventListener('input', function() {
    document.getElementById('login-err').classList.remove('show');
  });

  document.getElementById('btn-logout').addEventListener('click', logout);
  document.getElementById('btn-refresh').addEventListener('click', loadVotes);

  /* ── Boot ─────────────────────────────────────────────── */
  if (isLoggedIn()) { showDashboard(); loadVotes(); }

})();
</script>
</body>
</html>
