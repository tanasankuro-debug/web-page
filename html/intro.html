<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ขอนแก่นร้อนขึ้นจริงหรือเปล่า? — Heat Safe Khon Kaen</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Noto+Sans+Thai:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #150826;
    }

    /* ── Video background ── */
    .intro-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* ── Gradient veil at bottom so button reads clean ── */
    .intro-shade {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(to top, rgba(8,3,20,0.65) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ── CTA wrapper ── */
    .intro-cta {
      position: fixed;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    /* ── Main button ── */
    .intro-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 1.1rem 3.8rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #1a0a00;
      text-decoration: none;
      background: linear-gradient(135deg, #FDE047 0%, #FBBF24 55%, #F59E0B 100%);
      border-radius: 100px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow:
        0 0 0 5px rgba(253,224,71,0.22),
        0 10px 48px rgba(245,158,11,0.6),
        0 3px 10px rgba(0,0,0,0.45);
      animation:
        btn-enter 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both,
        pulse-glow 2.4s ease-in-out 1.35s infinite;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .intro-btn:hover,
    .intro-btn:focus-visible {
      outline: none;
      transform: scale(1.07);
      box-shadow:
        0 0 0 10px rgba(253,224,71,0.18),
        0 14px 60px rgba(245,158,11,0.85),
        0 3px 10px rgba(0,0,0,0.45);
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow:
          0 0 0 5px rgba(253,224,71,0.22),
          0 10px 48px rgba(245,158,11,0.6),
          0 3px 10px rgba(0,0,0,0.45);
      }
      50% {
        box-shadow:
          0 0 0 14px rgba(253,224,71,0.1),
          0 10px 65px rgba(245,158,11,0.9),
          0 3px 10px rgba(0,0,0,0.45);
      }
    }

    /* ── Button entrance ── */
    @keyframes btn-enter {
      0%   { opacity: 0; transform: translateY(40px) scale(0.8); }
      60%  { transform: translateY(-8px) scale(1.05); }
      80%  { transform: translateY(4px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Hint text below button ── */
    .intro-hint {
      font-family: 'Noto Sans Thai', sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.04em;
      animation:
        fade-up 0.5s ease 1.3s both,
        blink-hint 2.8s ease-in-out 1.8s infinite;
    }

    @keyframes blink-hint {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.9; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Navigation dots ── */
    .intro-dots {
      animation: fade-up 0.5s ease 1.5s both;
      position: fixed;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      gap: 0.55rem;
      align-items: center;
    }
    .intro-dot {
      display: block;
      height: 8px;
      border-radius: 100px;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .intro-dot-active  { width: 26px; background: #fff; cursor: default; }
    .intro-dot-inactive { width: 8px; background: rgba(255,255,255,0.32); }
    .intro-dot-inactive:hover { background: rgba(255,255,255,0.65); }

    /* ── Mobile — วางปุ่มตรงช่องว่างกลางระหว่างตัวละคร ── */
    @media (max-width: 768px) {
      .intro-btn  { font-size: 1.35rem; padding: 0.9rem 2.5rem; }
      .intro-cta  { top: 44%; bottom: auto; }
      .intro-dots { bottom: 4%; }
      .intro-hint { font-size: 0.72rem; }
    }
    @media (max-width: 400px) {
      .intro-btn  { font-size: 1.15rem; padding: 0.8rem 2rem; }
      .intro-cta  { top: 44%; bottom: auto; }
    }
  </style>
</head>
<body>

  <video
    class="intro-video"
    id="intro-video"
    autoplay muted loop playsinline preload="auto">
  </video>

  <script>
    (function () {
      var video = document.getElementById('intro-video');
      var mobile = window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      video.src = mobile ? '../assets/intro mobile.mp4' : '../assets/intro.mp4';
    })();
  </script>

  <div class="intro-shade" aria-hidden="true"></div>

  <div class="intro-cta">
    <a href="why.html" class="intro-btn" role="button" aria-label="เริ่มต้นใช้งาน — เข้าสู่ Heat Safe Khon Kaen">
      LET'S START!
      <svg viewBox="0 0 20 20" fill="none" width="20" height="20"
           stroke="currentColor" stroke-width="2.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 10h10M11 6l4 4-4 4"/>
      </svg>
    </a>
    <span class="intro-hint">แตะเพื่อเริ่มต้น</span>
  </div>

  <!-- Page dots -->
  <nav class="intro-dots" aria-label="ขั้นตอน">
    <span class="intro-dot intro-dot-active" aria-current="page" aria-label="หน้าที่ 1"></span>
    <a href="why.html" class="intro-dot intro-dot-inactive" aria-label="หน้าที่ 2"></a>
  </nav>

</body>
</html>
