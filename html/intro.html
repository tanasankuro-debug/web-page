<!DOCTYPE html>
<html lang="th" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ขอนแก่นร้อนขึ้นจริงหรือเปล่า? — Heat Safe Khon Kaen</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Noto+Sans+Thai:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #150826;
    }

    /* ── Video background ── */
    .intro-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* ── Gradient veil at bottom so button reads clean ── */
    .intro-shade {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(to top, rgba(8,3,20,0.65) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ── CTA wrapper ── */
    .intro-cta {
      position: fixed;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    /* ── Main button ── */
    .intro-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 1.1rem 3.8rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #1a0a00;
      text-decoration: none;
      background: linear-gradient(135deg, #FDE047 0%, #FBBF24 55%, #F59E0B 100%);
      border-radius: 100px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow:
        0 0 0 5px rgba(253,224,71,0.22),
        0 10px 48px rgba(245,158,11,0.6),
        0 3px 10px rgba(0,0,0,0.45);
      animation: pulse-glow 2.4s ease-in-out infinite;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .intro-btn:hover,
    .intro-btn:focus-visible {
      outline: none;
      transform: scale(1.07);
      box-shadow:
        0 0 0 10px rgba(253,224,71,0.18),
        0 14px 60px rgba(245,158,11,0.85),
        0 3px 10px rgba(0,0,0,0.45);
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow:
          0 0 0 5px rgba(253,224,71,0.22),
          0 10px 48px rgba(245,158,11,0.6),
          0 3px 10px rgba(0,0,0,0.45);
      }
      50% {
        box-shadow:
          0 0 0 14px rgba(253,224,71,0.1),
          0 10px 65px rgba(245,158,11,0.9),
          0 3px 10px rgba(0,0,0,0.45);
      }
    }

    /* ── Hint text below button ── */
    .intro-hint {
      font-family: 'Noto Sans Thai', sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.04em;
      animation: blink-hint 2.8s ease-in-out infinite;
    }

    @keyframes blink-hint {
      0%, 100% { opacity: 0.45; }
      50%       { opacity: 0.9; }
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .intro-btn  { font-size: 1.5rem; padding: 0.95rem 2.8rem; }
      .intro-cta  { bottom: 10%; }
    }
  </style>
</head>
<body>

  <video
    class="intro-video"
    src="../assets/intro.mp4"
    autoplay muted loop playsinline preload="auto">
  </video>

  <div class="intro-shade" aria-hidden="true"></div>

  <div class="intro-cta">
    <a href="index.html" class="intro-btn" role="button" aria-label="เริ่มต้นใช้งาน — เข้าสู่ Heat Safe Khon Kaen">
      LET'S START!
      <svg viewBox="0 0 20 20" fill="none" width="20" height="20"
           stroke="currentColor" stroke-width="2.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 10h10M11 6l4 4-4 4"/>
      </svg>
    </a>
    <span class="intro-hint">แตะเพื่อเริ่มต้น</span>
  </div>

</body>
</html>
