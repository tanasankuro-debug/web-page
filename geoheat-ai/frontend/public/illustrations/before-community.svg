<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="plaza3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9c6ba"/>
      <stop offset="100%" stop-color="#a19d8e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky3)"/>
  <circle cx="120" cy="90" r="40" fill="#fb923c" opacity="0.8"/>

  <!-- low buildings around plaza -->
  <rect x="0" y="150" width="180" height="90" fill="#b7b3a4"/>
  <rect x="620" y="140" width="180" height="100" fill="#b7b3a4"/>

  <rect x="0" y="240" width="800" height="210" fill="url(#plaza3)"/>

  <!-- large paving grid -->
  <g stroke="#8a8677" stroke-width="2" opacity="0.5">
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
    <line x1="130" y1="240" x2="130" y2="450"/>
    <line x1="270" y1="240" x2="270" y2="450"/>
    <line x1="410" y1="240" x2="410" y2="450"/>
    <line x1="550" y1="240" x2="550" y2="450"/>
    <line x1="690" y1="240" x2="690" y2="450"/>
  </g>

  <!-- a couple of sparse small trees at the far edges only -->
  <g>
    <rect x="60" y="255" width="10" height="30" fill="#8a6f4e"/>
    <circle cx="65" cy="248" r="22" fill="#7f9a6e"/>
    <rect x="730" y="250" width="10" height="30" fill="#8a6f4e"/>
    <circle cx="735" cy="243" r="22" fill="#7f9a6e"/>
  </g>

  <text x="40" y="420" font-family="sans-serif" font-size="20" fill="#5c5648" opacity="0.75">ลานชุมชนพื้นคอนกรีต — Before</text>
</svg>
