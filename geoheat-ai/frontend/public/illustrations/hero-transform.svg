<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="28%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fef9c3"/>
      <stop offset="78%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="heroGround" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0ab98"/>
      <stop offset="30%" stop-color="#9c9884"/>
      <stop offset="52%" stop-color="#7fa568"/>
      <stop offset="75%" stop-color="#4d7c3f"/>
      <stop offset="100%" stop-color="#3a6630"/>
    </linearGradient>
    <radialGradient id="heroSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#heroSky)"/>

  <!-- heat glow, left (before) side -->
  <circle cx="220" cy="170" r="150" fill="url(#heroSun)"/>
  <circle cx="220" cy="170" r="60" fill="#fb923c"/>

  <!-- sun on the after side, softer -->
  <circle cx="1010" cy="140" r="46" fill="#fde047" opacity="0.9"/>

  <rect x="0" y="430" width="1200" height="370" fill="url(#heroGround)"/>

  <!-- === BEFORE: cracked concrete, left zone === -->
  <g stroke="#6b6a5f" stroke-width="3" opacity="0.5">
    <line x1="0" y1="520" x2="560" y2="520"/>
    <line x1="0" y1="640" x2="560" y2="640"/>
    <line x1="140" y1="430" x2="140" y2="800"/>
    <line x1="320" y1="430" x2="320" y2="800"/>
    <line x1="480" y1="430" x2="480" y2="800"/>
    <path d="M200 520 L235 565 L210 605" fill="none" stroke="#57564c" stroke-width="3"/>
  </g>
  <!-- wilted planter -->
  <g>
    <rect x="60" y="560" width="90" height="58" rx="6" fill="#9a7b5a"/>
    <ellipse cx="105" cy="560" rx="44" ry="12" fill="#7a6146"/>
    <path d="M105 560 C80 520 78 495 86 468" stroke="#a3a08a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M105 560 C124 522 132 500 122 472" stroke="#a3a08a" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- === AI scan seam, center === -->
  <rect x="565" y="80" width="90" height="720" fill="url(#scanGlow)"/>
  <line x1="610" y1="80" x2="610" y2="800" stroke="#22c55e" stroke-width="2" opacity="0.6" stroke-dasharray="2 10"/>
  <circle cx="610" cy="230" r="7" fill="#22c55e"/>
  <circle cx="610" cy="230" r="16" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5"/>

  <!-- === AFTER: lush garden, right zone === -->
  <g fill="#d6cdb8" opacity="0.9">
    <ellipse cx="760" cy="560" rx="24" ry="11"/>
    <ellipse cx="770" cy="600" rx="28" ry="12"/>
    <ellipse cx="785" cy="640" rx="30" ry="13"/>
  </g>

  <!-- palm -->
  <g>
    <rect x="890" y="330" width="16" height="150" fill="#7a5a34" rx="7"/>
    <path d="M898 330 C810 290 780 235 765 175 C845 215 888 265 898 330 Z" fill="#22c55e"/>
    <path d="M898 330 C808 318 770 332 745 372 C838 372 882 352 898 330 Z" fill="#16a34a"/>
    <path d="M898 330 C985 290 1015 235 1030 175 C950 215 908 265 898 330 Z" fill="#4ade80"/>
    <path d="M898 330 C988 318 1026 332 1051 372 C958 372 914 352 898 330 Z" fill="#15803d"/>
  </g>

  <!-- shrubs -->
  <g fill="#2f9e44">
    <circle cx="700" cy="580" r="40"/>
    <circle cx="760" cy="600" r="32"/>
    <circle cx="1080" cy="600" r="42"/>
    <circle cx="1140" cy="620" r="30"/>
  </g>
  <g fill="#4ade80">
    <circle cx="715" cy="565" r="16" opacity="0.7"/>
    <circle cx="1095" cy="585" r="16" opacity="0.7"/>
  </g>
  <g stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M980 640 C955 615 950 590 962 565"/>
    <path d="M980 640 C990 610 1010 590 1030 578"/>
  </g>

  <!-- floating UI chip: Green Score, echoes the real app -->
  <g>
    <rect x="860" y="90" width="230" height="112" rx="24" fill="#ffffff" opacity="0.96"/>
    <rect x="860" y="90" width="230" height="112" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/>
    <circle cx="925" cy="146" r="34" fill="none" stroke="#e5e7eb" stroke-width="8"/>
    <circle cx="925" cy="146" r="34" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="192" stroke-dashoffset="40" transform="rotate(-90 925 146)"/>
    <text x="925" y="152" font-family="sans-serif" font-size="22" font-weight="700" fill="#14532d" text-anchor="middle">92</text>
    <text x="972" y="132" font-family="sans-serif" font-size="15" font-weight="600" fill="#14532d">Green Score</text>
    <text x="972" y="156" font-family="sans-serif" font-size="12" fill="#4b7a4f">พื้นที่สีเขียว +68%</text>
    <text x="972" y="176" font-family="sans-serif" font-size="12" fill="#4b7a4f">อุณหภูมิลดลง 4.2°C</text>
  </g>

  <text x="40" y="770" font-family="sans-serif" font-size="24" fill="#5c5c52" opacity="0.75">Before</text>
  <text x="1120" y="770" font-family="sans-serif" font-size="24" fill="#ffffff" opacity="0.9" text-anchor="end">After</text>
</svg>
